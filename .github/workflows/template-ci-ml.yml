name: CI - TEMPLATE

on:
  workflow_call:
    inputs:
      PYTHON_VERSION:
        description: "Versão usada para instalação do Python"
        required: false
        type: string
      path-tests:
        description: "Caminho para os testes"
        required: true
        default: "tests/"
        type: string
      working-directory:
        description: "Pasta do projeto (onde fica o pyproject.toml)"
        required: false
        default: "."
        type: string
    secrets:
      TOKEN_GITHUB:
        description: "Token do GitHub"
        required: true

jobs:
  validacao-ambiente:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Poetry
        run: pip install poetry

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          cache: "poetry"
          cache-dependency-path: ${{ inputs.working-directory }}/poetry.lock
    
      - name: Install Ruff (Linter)
        run: pip install ruff
        
      - name: Run Linter
        run: ruff check .

      - name: Install Dependencies
        run: poetry install
    
      - name: Run Tests
        run: poetry run python -m pytest ${{ inputs.path-tests }} -v
        env:
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}